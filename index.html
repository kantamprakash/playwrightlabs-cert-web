<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Playwright Labs Certification: take the Playwright Certified Tester exam online and earn a verifiable certificate." />
    <title>Playwright Labs Certification</title>
    <script>
      // Follows the device's light/dark setting unless the visitor picked one with the toggle.
      try {
        var t = localStorage.getItem('pwl-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
