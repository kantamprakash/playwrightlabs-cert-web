# Same routing as the production VPS. /api/** goes to ${API_UPSTREAM}: the gateway in the full stack
# (playwrightlabs-cert-deploy), or cert-api directly in cert-api's own compose file.
# This file is a template: the Nginx image fills in ${API_UPSTREAM} from the environment at startup.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    location /api/ {
        # Resolve the upstream through Docker's DNS on each request (not once at startup),
        # so recreating its container doesn't leave Nginx pointing at a stale IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /verify/PWL-...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
