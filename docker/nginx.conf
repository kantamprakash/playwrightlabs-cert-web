# Same routing as the production VPS. /api/** goes to ${API_UPSTREAM}: the gateway in the full stack
# (playwrightlabs-cert-deploy), or cert-api directly in cert-api's own compose file.
# This file is a template: the Nginx image fills in ${API_UPSTREAM} from the environment at startup.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    location /api/ {
        # Resolve the upstream on each request (not once at startup), so a recreated container or pod
        # doesn't leave Nginx pointing at a stale IP. NGINX_LOCAL_RESOLVERS is the DNS server from
        # /etc/resolv.conf: Docker's in Compose, the cluster's in Kubernetes (where the upstream must be
        # a full name such as gateway.<namespace>.svc.cluster.local, as Nginx ignores search domains).
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The lab's practice app (Labs Shop), which candidates open while writing tests. It is served under this
    # prefix with every URL relative, so it works here and at / inside the grading sandbox.
    location = /practice-app {
        return 301 /practice-app/;
    }
    location /practice-app/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $lab_app_upstream ${LAB_APP_UPSTREAM};
        rewrite ^/practice-app/(.*)$ /$1 break;
        proxy_pass $lab_app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Its own cookie, kept apart from the certification site's session.
        proxy_cookie_path / /practice-app/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /verify/PWL-...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
