# Same routing as the production VPS (see cert-api/deploy/nginx-certify.conf), with the API
# reached by its compose service name, "api".
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    location /api/ {
        # Resolve "api" through Docker's DNS on each request (not once at startup),
        # so recreating the api container doesn't leave Nginx pointing at a stale IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /verify/PWL-...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
